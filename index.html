<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-200">

    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Presensi Pegawai</h1>
      <p class="text-slate-500 text-sm mt-1">Pilih nama Anda lalu tekan Hadir</p>
    </div>

    <!-- Tampilan Live Kamera -->
    <div class="mb-5 flex flex-col items-center">
      <div class="relative w-full h-52 bg-slate-900 rounded-xl overflow-hidden shadow-inner flex flex-col items-center justify-center border border-slate-300">
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>

        <!-- Tombol Toggle Nyala/Mati Kamera -->
        <button id="btnToggleCamera" onclick="toggleCamera()" type="button" class="absolute top-2 right-2 bg-black/60 hover:bg-black/80 text-white text-xs px-3 py-1.5 rounded-full transition-all z-10">
          📷 Matikan Kamera
        </button>

        <div id="cameraStatusBox" class="absolute p-3 text-center w-full">
          <span id="cameraStatus" class="text-xs text-white bg-black/70 px-3 py-1.5 rounded-full block mb-2">
            Mengaktifkan kamera...
          </span>
          <button id="btnAllowCamera" onclick="requestCameraAccess()" class="hidden px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg shadow transition-all">
            📷 Klik Di Sini Untuk Aktifkan Kamera
          </button>
        </div>
      </div>
    </div>

    <!-- Kotak Notifikasi / Alert -->
    <div id="alertBox" class="hidden mb-5 p-4 rounded-xl text-center text-sm font-semibold transition-all"></div>

    <!-- Form Absensi -->
    <form id="attendanceForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Pegawai</label>
        <select id="selectPegawai" required onchange="handleSelectChange()" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-800">
          <option value="" disabled selected>-- Memuat daftar pegawai... --</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit" disabled class="w-full py-3.5 px-4 bg-slate-400 text-white font-semibold rounded-xl shadow-lg transition-all flex items-center justify-center cursor-not-allowed">
        <span id="btnText">Pilih nama terlebih dahulu</span>
        <div id="btnSpinner" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
      </button>
    </form>

  </div>

  <script>
    // ==========================================================
    // GANTI INI dengan URL /exec Apps Script Anda (yang sudah di-deploy
    // ulang dengan Code.gs versi baru yang punya doGet?action=list & doPost).
    // ==========================================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybktQYRSvYrqJ_4yRjZxT1whbk7FN_FJhGCCibo7afP3fadasSQpdZk9uKBDuDYW7q/exec';

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const cameraStatus = document.getElementById('cameraStatus');
    const btnAllowCamera = document.getElementById('btnAllowCamera');
    const btnToggleCamera = document.getElementById('btnToggleCamera');

    // Menyimpan stream aktif supaya bisa dihentikan (track.stop()) saat kamera dimatikan manual
    let cameraStream = null;

    window.onload = function () {
      initCamera();
      loadDaftarPegawai();
    };

    function initCamera() {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        cameraStatus.innerText = "Browser tidak mendukung akses kamera";
        return;
      }

      document.getElementById('cameraStatusBox').classList.remove('hidden');
      cameraStatus.innerText = "Mengaktifkan kamera...";
      btnAllowCamera.classList.add('hidden');
      updateToggleButton('loading');

      navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
        .then(stream => {
          cameraStream = stream;
          video.srcObject = stream;
          video.play();
          document.getElementById('cameraStatusBox').classList.add('hidden');
          updateToggleButton('on');
        })
        .catch(err => {
          console.error("Camera error:", err);

          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            cameraStatus.innerText = "Kamera diblokir. Klik gembok/ikon kunci di URL browser, izinkan Kamera, lalu klik tombol di bawah.";
          } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
            cameraStatus.innerText = "Tidak ada kamera terdeteksi di perangkat ini.";
          } else if (err.name === 'NotReadableError') {
            cameraStatus.innerText = "Kamera sedang dipakai aplikasi lain. Tutup aplikasi lain lalu coba lagi.";
          } else {
            cameraStatus.innerText = "Gagal mengakses kamera: " + err.name;
          }

          btnAllowCamera.classList.remove('hidden');
          updateToggleButton('off');
        });
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      video.srcObject = null;

      document.getElementById('cameraStatusBox').classList.remove('hidden');
      cameraStatus.innerText = "Kamera dimatikan";
      btnAllowCamera.classList.add('hidden');
      updateToggleButton('off');
    }

    // Dipanggil oleh tombol toggle di pojok kotak kamera
    function toggleCamera() {
      if (cameraStream) {
        stopCamera();
      } else {
        initCamera();
      }
    }

    // Dipanggil oleh tombol kuning "Klik Di Sini Untuk Aktifkan Kamera" saat izin ditolak
    function requestCameraAccess() {
      initCamera();
    }

    // Mengatur teks & tampilan tombol toggle sesuai kondisi kamera
    function updateToggleButton(state) {
      if (state === 'on') {
        btnToggleCamera.innerText = '📷 Matikan Kamera';
        btnToggleCamera.disabled = false;
      } else if (state === 'off') {
        btnToggleCamera.innerText = '📷 Nyalakan Kamera';
        btnToggleCamera.disabled = false;
      } else {
        btnToggleCamera.innerText = '📷 Memuat...';
        btnToggleCamera.disabled = true;
      }
    }

    // Ganti google.script.run -> fetch GET biasa ke ?action=list
    function loadDaftarPegawai() {
      fetch(APPS_SCRIPT_URL + '?action=list')
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            populatePegawai(res.data);
          } else {
            showError({ message: res.message || 'Gagal memuat daftar pegawai' });
          }
        })
        .catch(err => showError(err));
    }

    // Menyimpan status yang sedang berlaku untuk pegawai yang dipilih ('Masuk' | 'Pulang' | 'Selesai')
    let currentStatus = null;

    function handleSelectChange() {
      const nip = document.getElementById('selectPegawai').value;
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');

      if (!nip) {
        currentStatus = null;
        setButtonState(btn, btnText, 'disabled', 'Pilih nama terlebih dahulu');
        return;
      }

      setButtonState(btn, btnText, 'disabled', 'Mengecek status...');

      fetch(APPS_SCRIPT_URL + '?action=status&nip=' + encodeURIComponent(nip))
        .then(res => res.json())
        .then(res => {
          if (!res.success) {
            setButtonState(btn, btnText, 'disabled', 'Gagal mengecek status');
            return;
          }

          currentStatus = res.status;

          if (res.status === 'Masuk') {
            setButtonState(btn, btnText, 'masuk', 'Absen Masuk');
          } else if (res.status === 'Pulang') {
            setButtonState(btn, btnText, 'pulang', 'Absen Pulang');
          } else {
            setButtonState(btn, btnText, 'disabled', 'Sudah absen lengkap hari ini');
          }
        })
        .catch(() => {
          setButtonState(btn, btnText, 'disabled', 'Gagal mengecek status, coba pilih ulang');
        });
    }

    // Mengatur tampilan tombol sesuai state: 'masuk' (hijau), 'pulang' (biru), 'disabled' (abu-abu)
    function setButtonState(btn, btnText, state, text) {
      btnText.innerText = text;

      btn.classList.remove(
        'bg-emerald-600', 'hover:bg-emerald-700', 'active:bg-emerald-800', 'shadow-emerald-600/30',
        'bg-blue-600', 'hover:bg-blue-700', 'active:bg-blue-800', 'shadow-blue-600/30',
        'bg-slate-400', 'cursor-not-allowed'
      );

      if (state === 'masuk') {
        btn.disabled = false;
        btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'active:bg-emerald-800', 'shadow-emerald-600/30');
      } else if (state === 'pulang') {
        btn.disabled = false;
        btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'active:bg-blue-800', 'shadow-blue-600/30');
      } else {
        btn.disabled = true;
        btn.classList.add('bg-slate-400', 'cursor-not-allowed');
      }
    }

    function populatePegawai(list) {
      const select = document.getElementById('selectPegawai');
      select.innerHTML = '<option value="" disabled selected>-- Pilih Nama Anda --</option>';

      if (!list || list.length === 0) {
        select.innerHTML = '<option value="" disabled selected>Data pegawai tidak ditemukan</option>';
        return;
      }

      list.forEach(p => {
        const option = document.createElement('option');
        option.value = p.nip;
        option.textContent = `${p.nama} (${p.kategori})`;
        select.appendChild(option);
      });
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      if (!video.srcObject || video.readyState < 2) {
        const alertBox = document.getElementById('alertBox');
        alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800');
        alertBox.classList.add('bg-red-100', 'text-red-700');
        alertBox.innerText = "Kamera belum aktif. Aktifkan kamera terlebih dahulu sebelum absen.";
        return;
      }

      const nip = document.getElementById('selectPegawai').value;

      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageBase64 = canvas.toDataURL('image/jpeg', 0.7);

      setLoading(true);

      // Ganti google.script.run -> fetch POST.
      // Content-Type WAJIB 'text/plain' (lihat catatan CORS di Code.gs).
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ nip, imageBase64 })
      })
        .then(res => res.json())
        .then(onSuccess)
        .catch(showError);
    }

    function onSuccess(res) {
      setLoading(false);
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-800');

      if (res.success) {
        alertBox.classList.add('bg-emerald-100', 'text-emerald-800');
        alertBox.innerText = res.message;

        document.getElementById('attendanceForm').reset();
        currentStatus = null;
        setButtonState(
          document.getElementById('btnSubmit'),
          document.getElementById('btnText'),
          'disabled',
          'Pilih nama terlebih dahulu'
        );

        setTimeout(() => {
          alertBox.classList.add('hidden');
        }, 3000);
      } else {
        alertBox.classList.add('bg-red-100', 'text-red-700');
        alertBox.innerText = res.message;
      }
    }

    function showError(err) {
      setLoading(false);
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800');
      alertBox.classList.add('bg-red-100', 'text-red-700');
      alertBox.innerText = "Terjadi kesalahan: " + (err.message || err);
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      if (isLoading) {
        btn.disabled = true;
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');
      } else {
        btn.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
